name: Tests
on:
  push:
  pull_request:

jobs:
  model-and-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node tests/model.test.cjs
      - run: python3 -B tests/test_store.py
